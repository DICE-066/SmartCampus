<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Add Result')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('academic')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-plus-circle" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Academic Management</p>
                <h1 class="h3 mb-1">Add academic result</h1>
              </div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{/academic}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back</a></div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-xl-8">
              <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
              <form class="panel" th:action="@{/academic/save}" th:object="${record}" method="post">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-journal-text" aria-hidden="true"></i><span>Result details</span></h2></div></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" th:field="*{studentId}" required></div>
                  <div class="col-md-6"><label class="form-label">Course (e.g. CMPG224)</label><input class="form-control" th:field="*{courseName}" required></div>
                  <div class="col-md-6"><label class="form-label">Credits</label><input class="form-control" type="number" min="1" th:field="*{credits}" value="16"></div>
                  <div class="col-md-6"><label class="form-label">Grade (0-100)</label><input class="form-control" type="number" min="0" max="100" step="0.01" th:field="*{grade}"></div>
                </div>
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-secondary" th:href="@{/academic}">Cancel</a>
                  <button class="btn btn-primary" type="submit"><i class="bi bi-check2" aria-hidden="true"></i> Save result</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
