<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Student Results')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('academic')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-mortarboard" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Academic Management</p>
                <h1 class="h3 mb-1">Student results</h1>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-outline-secondary btn-sm" sec:authorize="hasRole('ADMIN')" th:href="@{/academic}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back</a>
              <a class="btn btn-outline-secondary btn-sm" sec:authorize="hasRole('STUDENT')" th:href="@{/}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Home</a>
            </div>
          </div>

          <section class="row g-3 mt-1" th:unless="${student}" sec:authorize="hasRole('ADMIN')">
            <div class="col-12 col-md-6">
              <form class="panel" th:action="@{/academic/results}" method="get">
                <label class="form-label">Student ID</label>
                <input class="form-control" name="studentId">
                <button class="btn btn-primary mt-3" type="submit">Load</button>
              </form>
            </div>
          </section>

          <section class="row g-3 mt-1" th:if="${student}">
            <div class="col-12 col-sm-6 col-xl-3">
              <article class="metric-card metric-primary">
                <div class="metric-top"><span class="metric-label">GPA</span><span class="metric-icon"><i class="bi bi-award" aria-hidden="true"></i></span></div>
                <div class="metric-value" th:text="${#numbers.formatDecimal(gpa,1,2)}">0.00</div>
                <div class="metric-meta"><span th:text="${totalCredits} + ' credits'"></span></div>
              </article>
            </div>
            <div class="col-12 col-xl-9">
              <div class="panel h-100">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-person" aria-hidden="true"></i><span th:text="${student.fullName}">Student</span></h2><p class="text-muted mb-0" th:text="${student.studentNumber}"></p></div></div>
              </div>
            </div>
          </section>

          <section class="row g-3 mt-1" th:if="${student}">
            <div class="col-12">
              <div class="panel">
                <div class="panel-header">
                  <div><h2 class="h5 mb-1 section-title"><i class="bi bi-table" aria-hidden="true"></i><span>Results</span></h2></div>
                  <a class="btn btn-primary btn-sm" sec:authorize="hasRole('ADMIN')" th:href="@{'/academic/add'(studentId=${student.studentId})}"><i class="bi bi-plus-circle" aria-hidden="true"></i> Add result</a>
                </div>
                <div class="table-responsive">
                  <table class="table align-middle mb-0">
                    <thead><tr><th>Course</th><th>Credits</th><th>Grade</th><th sec:authorize="hasRole('ADMIN')" class="text-end">Update</th></tr></thead>
                    <tbody>
                      <tr th:each="r : ${records}">
                        <td th:text="${r.courseName}"></td>
                        <td th:text="${r.credits}"></td>
                        <td th:text="${r.grade}"></td>
                        <td sec:authorize="hasRole('ADMIN')" class="text-end">
                          <form class="d-flex justify-content-end gap-1" th:action="@{'/academic/records/' + ${r.recordId} + '/edit'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="studentId" th:value="${student.studentId}">
                            <input type="hidden" name="courseName" th:value="${r.courseName}">
                            <input type="hidden" name="credits" th:value="${r.credits}">
                            <input class="form-control form-control-sm" style="width:80px" type="number" name="grade" th:value="${r.grade}" min="0" max="100" step="0.01">
                            <button class="btn btn-light btn-sm" type="submit">Update</button>
                          </form>
                        </td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(records)}"><td colspan="4">No results yet for this student.</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
