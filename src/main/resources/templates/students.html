<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Students')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('students')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Student Management</p>
                <h1 class="h3 mb-1">Students</h1>
                <p class="text-muted mb-0">Register, edit, search, and review student records.</p>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-outline-secondary btn-sm" th:href="@{/students/search}"><i class="bi bi-search" aria-hidden="true"></i> Search</a>
              <a class="btn btn-primary btn-sm" th:href="@{/students/new}"><i class="bi bi-person-plus" aria-hidden="true"></i> Register student</a>
            </div>
          </div>

          <div class="alert alert-success py-2 mt-3" th:if="${message}" th:text="${message}"></div>

          <section class="panel mt-3">
            <div class="panel-header">
              <div>
                <h2 class="h5 mb-1 section-title"><i class="bi bi-table" aria-hidden="true"></i><span>All students</span></h2>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead><tr><th>Student</th><th>Programme</th><th>Year</th><th>Status</th><th class="text-end">Action</th></tr></thead>
                <tbody>
                  <tr th:each="s : ${students}">
                    <td>
                      <p class="fw-semibold mb-0" th:text="${s.fullName}"></p>
                      <p class="text-muted small mb-0" th:text="${s.studentNumber}"></p>
                    </td>
                    <td th:text="${s.programme}"></td>
                    <td th:text="${s.yearOfStudy}"></td>
                    <td><span class="badge text-bg-success" th:text="${s.status}"></span></td>
                    <td class="text-end">
                      <a class="btn btn-light btn-sm" th:href="@{'/students/' + ${s.studentId}}">View</a>
                      <form class="d-inline" th:action="@{'/students/' + ${s.studentId} + '/delete'}" method="post"
                            onsubmit="return confirm('Delete this student?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(students)}"><td colspan="5">No students registered yet.</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
