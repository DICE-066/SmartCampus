<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Student Form')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('students')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Student Management</p>
                <h1 class="h3 mb-1" th:text="${student.studentId} != null ? 'Edit student' : 'Register student'">Register student</h1>
              </div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{/students}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to students</a></div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-xl-8">
              <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
              <form class="panel" th:action="@{/students/save}" th:object="${student}" method="post">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-person" aria-hidden="true"></i><span>Student information</span></h2></div></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{studentId}">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Student number</label><input class="form-control" th:field="*{studentNumber}" required></div>
                  <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" th:field="*{fullName}" required></div>
                  <div class="col-md-6"><label class="form-label">Programme</label><input class="form-control" th:field="*{programme}" placeholder="e.g. BEng Electronic Engineering" required></div>
                  <div class="col-md-6"><label class="form-label">Year of study</label><input class="form-control" type="number" min="1" max="6" th:field="*{yearOfStudy}" required></div>
                  <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                      <option value="active">active</option>
                      <option value="graduated">graduated</option>
                      <option value="deregistered">deregistered</option>
                    </select>
                  </div>
                </div>
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-secondary" th:href="@{/students}">Cancel</a>
                  <button class="btn btn-primary" type="submit"><i class="bi bi-check2" aria-hidden="true"></i> Save</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
