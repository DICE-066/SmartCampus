<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
              <div><p class="eyebrow mb-1">Account</p><h1 class="h3 mb-1">My Profile</h1></div>
            </div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-xl-4">
              <div class="panel h-100 text-center profile-card">
                <div class="profile-hero">
                  <img class="avatar-img avatar-xl profile-photo" th:src="@{/images/avatar/avatar.jpg}" alt="User avatar">
                  <h2 class="h5 mb-1" th:text="${user.username}">username</h2>
                  <p class="text-muted mb-3" th:text="${user.role}">ROLE</p>
                  <span class="badge text-bg-success">Active</span>
                </div>
                <div class="info-list mt-4 text-start">
                  <div><span>Username</span><strong th:text="${user.username}"></strong></div>
                  <div><span>Role</span><strong th:text="${user.role}"></strong></div>
                  <div th:if="${linkedStudent}"><span>Linked student</span><strong th:text="${linkedStudent.studentNumber} + ' — ' + ${linkedStudent.fullName}"></strong></div>
                  <div th:unless="${linkedStudent}" sec:authorize="hasRole('STUDENT')"><span>Linked student</span><strong>Not linked yet</strong></div>
                </div>
              </div>
            </div>

            <div class="col-12 col-xl-8">
              <div class="alert alert-success py-2" th:if="${message}" th:text="${message}"></div>
              <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

              <form class="panel" th:action="@{/profile/password}" method="post">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-shield-lock" aria-hidden="true"></i><span>Change password</span></h2></div></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                  <div class="col-md-12"><label class="form-label">Current password</label><input class="form-control" type="password" name="currentPassword" required></div>
                  <div class="col-md-6"><label class="form-label">New password</label><input class="form-control" type="password" name="newPassword" minlength="6" required></div>
                  <div class="col-md-6"><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirmPassword" minlength="6" required></div>
                </div>
                <div class="d-flex justify-content-end mt-4">
                  <button class="btn btn-primary" type="submit"><i class="bi bi-check2" aria-hidden="true"></i> Update password</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
