<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Upload Document')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('documents')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-upload" aria-hidden="true"></i></span>
              <div><p class="eyebrow mb-1">Documents</p><h1 class="h3 mb-1">Upload a document</h1></div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{'/documents'(studentId=${studentId})}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back</a></div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-xl-8">
              <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
              <form class="panel" th:action="@{/documents/upload}" method="post" enctype="multipart/form-data">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-file-earmark-arrow-up" aria-hidden="true"></i><span>File upload</span></h2><p class="text-muted mb-0">Max 10MB.</p></div></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" name="studentId" th:value="${studentId}" required></div>
                  <div class="col-md-6"><label class="form-label">File</label><input class="form-control" type="file" name="file" required></div>
                </div>
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-secondary" th:href="@{'/documents'(studentId=${studentId})}">Cancel</a>
                  <button class="btn btn-primary" type="submit"><i class="bi bi-upload" aria-hidden="true"></i> Upload</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
