<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Search Students')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('students')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-search" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Student Management</p>
                <h1 class="h3 mb-1">Search by student number</h1>
              </div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{/students}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to students</a></div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12">
              <form class="panel" th:action="@{/students/search}" method="get">
                <div class="row g-2 align-items-end">
                  <div class="col-md-6"><label class="form-label">Student number</label><input class="form-control" name="studentNumber" placeholder="e.g. 30123456"></div>
                  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Search</button></div>
                </div>
              </form>
            </div>
          </section>

          <section class="row g-3 mt-1" th:if="${searched}">
            <div class="col-12">
              <div class="panel">
                <div class="table-responsive">
                  <table class="table align-middle mb-0">
                    <thead><tr><th>Student</th><th>Programme</th><th>Year</th><th class="text-end">Action</th></tr></thead>
                    <tbody>
                      <tr th:each="s : ${results}">
                        <td>
                          <p class="fw-semibold mb-0" th:text="${s.fullName}"></p>
                          <p class="text-muted small mb-0" th:text="${s.studentNumber}"></p>
                        </td>
                        <td th:text="${s.programme}"></td>
                        <td th:text="${s.yearOfStudy}"></td>
                        <td class="text-end"><a class="btn btn-light btn-sm" th:href="@{'/students/' + ${s.studentId}}">View</a></td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(results)}"><td colspan="4">No matching student number found.</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
