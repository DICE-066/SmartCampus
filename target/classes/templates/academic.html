<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Academic Records')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('academic')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-mortarboard" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Academic Management</p>
                <h1 class="h3 mb-1">Academic Records &amp; GPA</h1>
              </div>
            </div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-md-6">
              <div class="panel">
                <label class="form-label">Student ID</label>
                <input id="sid" class="form-control" placeholder="e.g. 1">
                <div class="d-flex flex-wrap gap-2 mt-3">
                  <button class="btn btn-primary" onclick="go('/academic/results')">View results &amp; GPA</button>
                  <button class="btn btn-outline-secondary" onclick="go('/academic/add')">Add a result</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
  <script th:inline="none">
  function go(path){
    const id = document.getElementById('sid').value.trim();
    window.location.href = path + (id ? '?studentId=' + encodeURIComponent(id) : '');
  }
  </script>
</body>
</html>
