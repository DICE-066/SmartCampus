<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reports')}"></head>
<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside th:replace="~{fragments/sidebar :: sidebar('reports')}"></aside>
    <div class="admin-main">
      <nav th:replace="~{fragments/topbar :: topbar}"></nav>
      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i></span>
              <div><p class="eyebrow mb-1">Reports</p><h1 class="h3 mb-1">Generate reports</h1></div>
            </div>
          </div>

          <section class="row g-3 mt-1">
            <div class="col-12 col-md-4">
              <div class="panel h-100 text-center">
                <i class="bi bi-people display-6 text-primary" aria-hidden="true"></i>
                <h2 class="h6 mt-2">Student report</h2>
                <a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/students/csv}"><i class="bi bi-download" aria-hidden="true"></i> Download CSV</a>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="panel h-100 text-center">
                <i class="bi bi-mortarboard display-6 text-success" aria-hidden="true"></i>
                <h2 class="h6 mt-2">Academic report</h2>
                <a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/academic/csv}"><i class="bi bi-download" aria-hidden="true"></i> Download CSV</a>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="panel h-100 text-center">
                <i class="bi bi-cash-coin display-6 text-warning" aria-hidden="true"></i>
                <h2 class="h6 mt-2">Financial report</h2>
                <a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/financial/csv}"><i class="bi bi-download" aria-hidden="true"></i> Download CSV</a>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
